name: licensing-pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cmd/werkbord-team/licensing/**
      - supabase/functions/licensing-artifact/verify.ts
      - .github/workflows/licensing-pages.yml
permissions:
  contents: read
concurrency:
  group: licensing-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/werkbord-team/licensing/ui/package-lock.json
      - name: Verify and build the public operator interface
        working-directory: cmd/werkbord-team/licensing/ui
        run: npm ci && npm test && npm run build:hosted
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/licensing
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the operator interface
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
