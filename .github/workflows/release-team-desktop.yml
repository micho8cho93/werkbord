name: release Team desktop
on:
  push:
    tags: ['werkbord-team-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    environment: team-desktop-release
    permissions:
      contents: read
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
      LICENSE_ISSUER_PUBLIC_KEY: ${{ secrets.TEAM_LICENSE_ISSUER_PUBLIC_KEY }}
      TEAM_RELEASE_PUBLIC_KEY: ${{ vars.TEAM_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Match the product tag and version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(scripts/product.sh werkbord-team version)"
          if [ "$EVENT" = push ] && [ "$TAG" != "werkbord-team-$version" ]; then exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check all Team signing, notarization and license issuer secrets
        run: scripts/check-release-secrets.sh team-desktop
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Import the certificate into a temporary keychain
        run: scripts/ci-keychain.sh create --require
      - name: Prepare notarization
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s\n' "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/notary/AuthKey.p8"
          echo "NOTARY_KEY_FILE=$RUNNER_TEMP/notary/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build a separate Team candidate for offline review
        run: |
          make web web-embed
          VERSION="v$(scripts/product.sh werkbord-team version)" scripts/build-team-desktop.sh --package
          # Finalization requires an offline signature of the exact helper bytes.
          # This candidate cannot enter the unified release or appcast.
          ditto -c -k --keepParent "dist/team-desktop/Werkbord Team.app" dist/team-desktop/Team-review.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: team-desktop
          path: |
            dist/team-desktop/*.dmg
            dist/team-desktop/*.sha256
            dist/team-desktop/Team-review.zip
            dist/team-desktop.manifest.json
          if-no-files-found: error
      - name: Remove the certificate and notarization key
        if: always()
        run: |
          scripts/ci-keychain.sh delete
          rm -rf "$RUNNER_TEMP/notary"
  # Reviewed Team artifacts are finalized and uploaded by the authorized offline
  # release operator. Incomplete releases remain drafts; CI never publishes a candidate.
