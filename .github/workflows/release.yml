name: release

# Publishes a release when a product's version tag is pushed. The tag says which
# product it is (docs/VERSIONING.md):
#
#   werkbord-vX.Y.Z        the individual product: werkbord_<version>_<os>_<arch> archives, which is
#                          what scripts/install.sh and `werkbord update` read, and the same archives
#                          as devboard_<version>_<os>_<arch>, which is what releases from before the
#                          rename read to update themselves; and, from the jobs below, the Mac app's
#                          disk image (Werkbord_<version>_darwin_universal.dmg) and its .sha256
#   werkbord-team-vX.Y.Z   Werkbord Team: werkbord-team_<version>_<os>_<arch> archives
#
# Each release carries one archive per platform and a checksums.txt. Only the
# individual product's releases are marked "latest": /releases/latest is how the
# individual installer and updater find their product, so a Team release must never take it.
#
# The Mac app (docs/DESKTOP_RELEASE.md) is added to an individual release by four more jobs, and only to it:
#
#   desktop-build    macOS. The ONLY job that holds the signing, notarization and update-signing secrets. It builds the
#                    universal app, signs it with the Developer ID, has Apple notarize it, signs the update archive and
#                    the feed with the update key, and checks the result. It has no permission to change a release: it
#                    hands the files to the next jobs as workflow artifacts.
#   desktop-publish  no secrets. Uploads the disk image and the update archive, with their .sha256, to the release that
#                    already exists.
#   desktop-verify   a fresh macOS runner, no secrets. Downloads what was published as a person would, and checks it
#                    (scripts/verify-desktop-release.sh).
#   desktop-appcast  no secrets. Only when the image has verified: checks the feed against the published update archive,
#                    and publishes it as appcast.xml. That file is what tells installed apps an update exists, so it
#                    comes last, and is withdrawn again if what is served does not check out.
#
# None of them creates, edits or un-marks the release the first job made, or touches its archives and checksums.txt, and
# the only thing any of them ever deletes is the feed it published itself, so a failure in any of them turns the run red and
# leaves what installers and `werkbord update` depend on exactly as it was.
#
# A manual run (Actions → release → Run workflow) is a dry run: it builds, signs and notarizes the app from the branch it
# is run on, checks it, and uploads the disk image as a workflow artifact only. Nothing is published. That is how
# the secrets are tried before a real tag is pushed.
#
# Nothing from a pull request or a fork reaches a secret: this workflow is not triggered by either (ci.yml is), and
# the secrets are in the `desktop-release` environment, used by desktop-build alone.
on:
  push:
    tags:
      - 'werkbord-v[0-9]+.[0-9]+.[0-9]+'
      - 'werkbord-v[0-9]+.[0-9]+.[0-9]+-*'
      - 'werkbord-team-v[0-9]+.[0-9]+.[0-9]+'
      - 'werkbord-team-v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

# Nothing is writable unless a job says so.
permissions:
  contents: read

# Public trust anchor, separately provisioned from the downloaded Team artifact.
env:
  TEAM_RELEASE_PUBLIC_KEY: ${{ vars.TEAM_RELEASE_PUBLIC_KEY }}

jobs:
  # Does this tag get a disk image? The individual product's stable releases do; Team's, and pre-releases, do not.
  plan:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      desktop: ${{ steps.plan.outputs.desktop }}
    steps:
      - name: The Mac app
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          desktop=false
          if [ "$EVENT" = workflow_dispatch ]; then
            desktop=true
          else
            case "$REF_NAME" in
              werkbord-team-v*) ;;
              werkbord-v[0-9]*.[0-9]*.[0-9]*-*) ;;
              werkbord-v[0-9]*.[0-9]*.[0-9]*) desktop=true ;;
            esac
          fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"

  release:
    # Team CLI archives are signed on the offline release workstation. This job
    # has no vendor release key and must never publish unauthenticated Team packages.
    if: github.event_name == 'push' && startsWith(github.ref_name, 'werkbord-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Which product, and does the tag agree with its VERSION file
        id: product
        run: |
          # checkout fetches the tag as a bare ref; fetch the real tag objects so "annotated" can be checked
          git fetch --force --tags origin
          product=$(scripts/product.sh from-tag "$GITHUB_REF_NAME")
          scripts/verify-tag.sh "$product" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          version=$(scripts/product.sh "$product" version)
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "version=v$version" >> "$GITHUB_OUTPUT"
      - name: Check
        run: make check
      - name: Team's tests that start real database clusters (the pinned program, fetched and checked against the pin)
        if: startsWith(github.ref_name, 'werkbord-team-v')
        env:
          WERKBORD_REQUIRE_RQLITE: "1"
        run: make test-rqlite
      - name: Build the release archives
        run: make dist PRODUCT=${{ steps.product.outputs.product }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${{ steps.product.outputs.version }}" in
            *-*) flags="--prerelease --latest=false" ;;
            *)
              if [ "${{ steps.product.outputs.product }}" = werkbord ]; then
                flags="--latest"
              else
                flags="--latest=false"
              fi ;;
          esac
          # A manually tested Mac preview may already have its DMG on this prerelease.
          # Add only the CLI archives; preserve its preview notes, status and installer.
          if [ "$flags" = "--prerelease --latest=false" ] &&
             [ "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease 2>/dev/null)" = true ]; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $flags
          fi

  desktop-build:
    # After the release exists (a tag), or on its own (a dry run).
    needs: [plan, release]
    if: ${{ !cancelled() && needs.plan.outputs.desktop == 'true' && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 90
    # The secrets live here, in this environment, and are given to no other job. Protect it (docs/DESKTOP_RELEASE.md,
    # step 7): required reviewers, and only main and the werkbord-v* tags may deploy to it.
    environment: desktop-release
    permissions:
      contents: read
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: The version, and that the tag agrees with it
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="v$(scripts/product.sh werkbord version)"
          if [ "$EVENT" = push ] && [ "$REF_NAME" != "werkbord-$version" ]; then
            echo "::error::the tag $REF_NAME is not werkbord-$version, which cmd/werkbord/VERSION says"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=werkbord-$version" >> "$GITHUB_OUTPUT"
      - name: The signing and notarization secrets are all there
        run: scripts/check-release-secrets.sh desktop
      - name: Build the web app
        run: make web web-embed web-shell
      - name: Put the Developer ID certificate in a temporary keychain
        run: scripts/ci-keychain.sh create --require
      - name: Put the notarization key where only this job can read it
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s\n' "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/notary/AuthKey.p8"
          echo "NOTARY_KEY_FILE=$RUNNER_TEMP/notary/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Obtain the compatible independently signed and notarized Team installer
        run: |
          scripts/prepare-unified-team.sh "$RUNNER_TEMP/unified-team"
          echo "TEAM_DESKTOP_APP=$RUNNER_TEMP/unified-team/Werkbord Team.app" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and staple the universal app and disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-desktop.sh --package --release dist/desktop
      - name: Sign the update archive and make the feed (the private update key is only ever in this step's environment)
        run: |
          mkdir -p dist/feed
          scripts/make-appcast.sh --require dist/desktop/Werkbord_*_darwin_universal.zip dist/feed
      - name: Check what was built, as a person who downloads it would (nothing is published yet)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/page/$TAG"
          cp dist/desktop/Werkbord_*_darwin_universal.* "$RUNNER_TEMP/page/$TAG/"
          # the page a release will have: the same files the publishing job uploads, including the copy with no version in its name
          cp dist/desktop/Werkbord_*_darwin_universal.dmg "$RUNNER_TEMP/page/$TAG/Werkbord.dmg"
          cp dist/feed/appcast.xml "$RUNNER_TEMP/page/$TAG/"
          export WERKBORD_RELEASE_BASE="file://$RUNNER_TEMP/page"
          scripts/verify-desktop-release.sh "$TAG"
          WERKBORD_FEED_URL=none scripts/verify-appcast.sh "$TAG"
      - name: Hand the disk image and the update archive to the next job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-release
          path: |
            dist/desktop/Werkbord_*_darwin_universal.dmg
            dist/desktop/Werkbord_*_darwin_universal.dmg.sha256
            dist/desktop/Werkbord_*_darwin_universal.zip
            dist/desktop/Werkbord_*_darwin_universal.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Hand the feed to the last job (it is not published until the disk image has been checked)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-appcast
          path: dist/feed/appcast.xml
          if-no-files-found: error
          retention-days: 14
      - name: Remove the certificate and the notarization key
        if: always()
        run: |
          scripts/ci-keychain.sh delete || true
          rm -rf "$RUNNER_TEMP/notary"

  desktop-publish:
    needs: desktop-build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-release
          path: desktop
      - name: Add the disk image and the update archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Werkbord.dmg is the same file under a name with no version in it, so that
          # https://github.com/micho8cho93/werkbord/releases/latest/download/Werkbord.dmg is a link that is always the newest
          # app (the website's button, and a one-line curl). It is a copy, byte for byte: scripts/verify-desktop-release.sh checks that.
          cp desktop/Werkbord_*_darwin_universal.dmg desktop/Werkbord.dmg
          ls -l desktop
          # Only these five files, which no other job makes. --clobber is for re-running this job after a half-finished upload.
          gh release upload "$GITHUB_REF_NAME" \
            desktop/Werkbord_*_darwin_universal.dmg desktop/Werkbord_*_darwin_universal.dmg.sha256 desktop/Werkbord.dmg \
            desktop/Werkbord_*_darwin_universal.zip desktop/Werkbord_*_darwin_universal.zip.sha256 --clobber

  desktop-verify:
    needs: desktop-publish
    if: ${{ github.event_name == 'push' }}
    # A runner that built nothing and holds nothing: the check is what a stranger's Mac would find.
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Download the published disk image and check it
        run: scripts/verify-desktop-release.sh "$GITHUB_REF_NAME"
      - name: If the published disk image is not good
        if: failure()
        run: |
          echo "::error::The disk image published for $GITHUB_REF_NAME failed its check. The release, its archives and checksums.txt are untouched. To withdraw the disk image: gh release delete-asset $GITHUB_REF_NAME <its file name> (docs/DESKTOP_RELEASE.md, 'If something goes wrong')."

  desktop-appcast:
    needs: desktop-verify
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-appcast
          path: feed
      - name: The feed, against the update archive that was published
        env:
          WERKBORD_FEED_URL: none # the address apps use does not serve it yet
        run: scripts/verify-appcast.sh "$GITHUB_REF_NAME" feed/appcast.xml
      - name: Publish the feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" feed/appcast.xml --clobber
      - name: The address installed apps use serves exactly it
        run: scripts/verify-appcast.sh "$GITHUB_REF_NAME"
      - name: If the published feed is not good, withdraw it (it, and nothing else)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete-asset "$GITHUB_REF_NAME" appcast.xml -y || true
          echo "::error::The feed for $GITHUB_REF_NAME did not check out and was withdrawn: installed apps are not offered this release. The release, its archives and the disk image are untouched (docs/DESKTOP_RELEASE.md, 'If something goes wrong')."
