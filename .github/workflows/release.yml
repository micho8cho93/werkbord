name: release

# One tag produces one unified macOS-only release. Linux and Windows publication is deferred.
# Stable releases require the signed, notarized universal Mac app and public download checks. Only the desktop app
# carries the Team installer/service; this workflow never publishes standalone Team Host archives.
on:
  push:
    tags:
      - 'werkbord-v[0-9]+.[0-9]+.[0-9]+'
      - 'werkbord-v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      desktop: ${{ steps.plan.outputs.desktop }}
      stable: ${{ steps.plan.outputs.stable }}
    steps:
      - name: Decide which release jobs apply
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          desktop=false
          stable=false
          if [ "$EVENT" = workflow_dispatch ]; then
            desktop=true
          elif [ "${REF_NAME#werkbord-v}" != "$REF_NAME" ]; then
            desktop=true
            case "${REF_NAME#werkbord-v}" in
              *-*) ;;
              *) desktop=true; stable=true ;;
            esac
          fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

  release-build:
    needs: plan
    if: github.event_name == 'push' && startsWith(github.ref_name, 'werkbord-v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify the unified product tag and version
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          git fetch --force --tags origin
          test "$(scripts/product.sh from-tag "$TAG")" = werkbord
          scripts/verify-tag.sh "$TAG" "$SHA"
      - name: Require reviewed Team production approval for stable releases
        if: ${{ github.event_name == 'push' && needs.plan.outputs.stable == 'true' }}
        run: scripts/check-team-production-gate.sh "${GITHUB_REF_NAME#werkbord-v}"
      - name: Run the repository checks
        run: make check
      - name: Run Team's pinned native network tests
        run: make test-nebula
      - name: Run Team's real database cluster tests
        env:
          WERKBORD_REQUIRE_RQLITE: "1"
        run: make test-rqlite
      - name: Verify the public app's browser flows before assembling downloads
        run: |
          cd web && npx playwright install --with-deps chromium webkit && cd ..
          BROWSER_ARTIFACT_DIR="$RUNNER_TEMP/werkbord-browser" make test-browser
          BROWSER_ARTIFACT_DIR="$RUNNER_TEMP/werkbord-browser/team-desktop" make test-team-desktop-browser
          BROWSER_ARTIFACT_DIR="$RUNNER_TEMP/werkbord-browser/unified" make test-unified-desktop-browser
          BROWSER_ARTIFACT_DIR="$RUNNER_TEMP/werkbord-browser/assistant" make test-assistant-browser
      - name: Build the controller archives for the unified release
        run: make dist PRODUCT=werkbord PLATFORMS="darwin/arm64 darwin/amd64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controller-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  desktop-build:
    needs: [plan, release-build]
    if: ${{ !cancelled() && needs.plan.outputs.desktop == 'true' && (github.event_name == 'workflow_dispatch' || needs.release-build.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 90
    environment: desktop-release
    permissions:
      contents: read
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      LICENSE_ISSUER_PUBLIC_KEY: ${{ secrets.TEAM_LICENSE_ISSUER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Resolve the build version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(scripts/product.sh werkbord version)
          if [ "$EVENT" = push ] && [ "$REF_NAME" != "werkbord-v$version" ]; then
            echo "::error::tag $REF_NAME does not match cmd/werkbord/VERSION ($version)"
            exit 1
          fi
          echo "version=v$version" >> "$GITHUB_OUTPUT"
          echo "tag=werkbord-v$version" >> "$GITHUB_OUTPUT"
      - name: Check release credentials before building
        run: scripts/check-release-secrets.sh desktop
      - name: Build the web app
        run: make web web-embed web-shell
      - name: Put the Developer ID certificate in a temporary keychain
        run: scripts/ci-keychain.sh create --require
      - name: Put the notarization key in a temporary file
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s\n' "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/notary/AuthKey.p8"
          echo "NOTARY_KEY_FILE=$RUNNER_TEMP/notary/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign and notarize the universal app and disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-desktop.sh --package --release dist/desktop
      - name: Sign the Sparkle update archive and feed
        run: |
          mkdir -p dist/feed
          scripts/make-appcast.sh --require dist/desktop/Werkbord_*_darwin_universal.zip dist/feed
      - name: Verify the disk image and feed before uploading workflow artifacts
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/page/$TAG"
          cp dist/desktop/Werkbord_*_darwin_universal.* "$RUNNER_TEMP/page/$TAG/"
          cp dist/desktop/Werkbord_*_darwin_universal.dmg "$RUNNER_TEMP/page/$TAG/Werkbord.dmg"
          cp dist/feed/appcast.xml "$RUNNER_TEMP/page/$TAG/"
          export WERKBORD_RELEASE_BASE="file://$RUNNER_TEMP/page"
          scripts/verify-desktop-release.sh "$TAG"
          WERKBORD_FEED_URL=none scripts/verify-appcast.sh "$TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-release
          path: |
            dist/desktop/Werkbord_*_darwin_universal.dmg
            dist/desktop/Werkbord_*_darwin_universal.dmg.sha256
            dist/desktop/Werkbord_*_darwin_universal.zip
            dist/desktop/Werkbord_*_darwin_universal.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-appcast
          path: dist/feed/appcast.xml
          if-no-files-found: error
          retention-days: 14
      - name: Remove the signing keychain and notarization key
        if: always()
        run: |
          scripts/ci-keychain.sh delete || true
          rm -rf "$RUNNER_TEMP/notary"

  desktop-draft:
    needs: [plan, release-build, desktop-build]
    if: github.event_name == 'push' && needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: controller-release
          path: assets/controller
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-release
          path: assets/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-appcast
          path: assets/feed
      - name: Assemble one release and reserve its display sequence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#werkbord-v}
          prerelease=false
          sequence=$(awk -F '|' -v tag="$GITHUB_REF_NAME" '{ build=$3; gsub(/[[:space:]`]/,"",build); if (build==tag) { display=$4; gsub(/[[:space:]`]/,"",display); print display } }' docs/RELEASE_SEQUENCE.md)
          printf '%s\n' "$sequence" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-preview\.[1-9][0-9]*)?$' || { echo 'Missing or invalid reserved release display sequence' >&2; exit 1; }
          qualifier=""
          case "$version" in
            *-preview.*) prerelease=true; qualifier=" (macOS preview)" ;;
            *) scripts/check-team-production-gate.sh "$version" ;;
          esac
          mkdir release-assets
          for dir in assets/controller assets/macos assets/feed; do
            cp "$dir"/* release-assets/
          done
          cp release-assets/Werkbord_"$version"_darwin_universal.dmg release-assets/Werkbord.dmg
          if find release-assets -maxdepth 1 -type f \( -name 'werkbord-team_*' -o -name 'checksums-team.txt*' \) | grep -q .; then
            echo 'Standalone Team Host archives must not be published with the desktop app.' >&2
            exit 1
          fi
          for file in \
            "Werkbord_${version}_darwin_universal.dmg" "Werkbord_${version}_darwin_universal.zip" \
            appcast.xml; do
            test -s "release-assets/$file" || { echo "required release asset is missing: $file" >&2; exit 1; }
          done
          cat > release-notes.md <<EOF
          **Release sequence:** $sequence · **Original build version:** $version

          The release sequence is a display label for this product’s published history. Downloads and installed apps use the original build version; the Git tag is \`$GITHUB_REF_NAME\`.

          ---

          Werkbord $version is the unified Individual and Team desktop app. It includes the Individual controller and the local Team workspace service and setup flow.

          ### Desktop downloads

          - **macOS:** universal Apple Silicon and Intel disk image, signed and notarized.
          Download Werkbord.dmg, open it and drag Werkbord to Applications. macOS may show its normal first-open confirmation; no security settings need to be disabled.

          Linux and Windows downloads are deferred for this release.

          macOS controller command-line archives and their checksum manifest are included for existing terminal and service workflows. This release has no standalone Team Host archive.
          EOF
          if [ "$prerelease" = true ]; then
            cat >> release-notes.md <<'EOF'

          ### Public preview scope

          This is an evaluation preview. Team production admission remains blocked. Evaluate Team using disposable workspaces and backups; clean-Mac privileged service and Keychain lifecycle, dependency findings, independent-host networking/failover and replacement-host recovery still need production acceptance. See docs/TEAM_SECURITY_GATE.md at this tag for the complete review.

          The preview is not marked latest and is not distributed through the stable update feed. Linux and Windows downloads are deferred.
          EOF
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* --title "Werkbord Individual — Release $sequence$qualifier" --notes-file release-notes.md --draft --prerelease="$prerelease" --latest=false --verify-tag

  desktop-publish:
    needs: desktop-draft
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the complete release without changing latest yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --verify-tag

  macos-public-verify:
    needs: desktop-publish
    if: github.event_name == 'push'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: Download the public release and verify Gatekeeper, notarization and Sparkle contents
        run: scripts/verify-desktop-release.sh "$GITHUB_REF_NAME"

  desktop-feed-public-verify:
    needs: desktop-publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Verify the public Sparkle feed against the release archive and embedded key
        env:
          WERKBORD_FEED_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/appcast.xml
        run: scripts/verify-appcast.sh "$GITHUB_REF_NAME"

  stable-latest:
    needs: [plan, macos-public-verify, desktop-feed-public-verify]
    if: github.event_name == 'push' && needs.plan.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark this fully verified stable release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest --verify-tag
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$GITHUB_REF_NAME"
