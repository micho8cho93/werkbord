name: release

# Publishes a release when a version tag is pushed: one archive per platform and a
# checksums.txt, which is what scripts/install.sh and `devboard update` read.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check
        run: make check
      - name: Build the release archives
        run: make dist VERSION=${{ github.ref_name }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${{ github.ref_name }}" in *-*) flags="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes $flags
